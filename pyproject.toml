[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secom-yield-monitoring"
version = "0.1.0"
description = "SECOM yield monitoring implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
  "skrebate==0.62",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:tmpdir -p no:cacheprovider --cache-clear"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "scripts"]
exclude = [
  "archive",
  "data",
  "notebooks",
  "reports",
  "runs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
